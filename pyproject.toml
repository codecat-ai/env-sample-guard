[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "env-sample-guard"
version = "0.1.0"
description = "Check that environment variables used in source code match a sample env file."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "env-sample-guard contributors" }]
keywords = ["environment", "dotenv", "ci", "configuration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
env-sample-guard = "env_sample_guard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/env_sample_guard"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
